<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okinawa 4 Days · โอกินาว่า · 沖縄</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --paper:#f4ecd8;
    --card:#fffdf6;
    --indigo:#153a4b;
    --indigo-deep:#0b2530;
    --indigo-2:#1f6178;
    --vermillion:#d1472c;
    --vermillion-dark:#a83a22;
    --ink:#241f16;
    --ink-soft:#6f6551;
    --line:#ddccA0;
    --line-strong:#c9b784;
    --d1:#d1472c;
    --d2:#1f6178;
    --d3:#2e8b67;
    --d4:#c98f2b;
    --d5:#7a4f8c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Thai','Noto Sans JP',sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(21,58,75,0.07) 1px, transparent 0) 0 0/22px 22px,
      var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:'Chonburi','Noto Sans JP',cursive;font-weight:400;}

  /* ===== Lang switcher ===== */
  .langbar{
    position:fixed;
    top:16px;right:16px;
    z-index:50;
    display:flex;
    background:rgba(11,37,48,0.85);
    backdrop-filter:blur(6px);
    border-radius:999px;
    padding:4px;
    gap:2px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .langbtn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    padding:7px 13px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:#cfe3e6;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .langbtn.active{background:#fff;color:var(--indigo-deep);}
  .langbtn:hover:not(.active){color:#fff;}

  /* ===== Hero ===== */
  .hero{
    background:
      radial-gradient(circle at 88% 18%, rgba(255,255,255,0.09), transparent 46%),
      linear-gradient(160deg,var(--indigo-deep) 0%,var(--indigo) 58%,var(--indigo-2) 100%);
    color:#fff;
    padding:44px 24px 58px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 34px);
    pointer-events:none;
  }
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .hero-text{flex:1;min-width:260px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:11.5px;
    color:#9fd0d6;
    font-weight:700;
    margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(26px,4vw,42px);
    margin:0 0 14px;
    line-height:1.32;
    color:#fdf7e6;
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .hero p.sub{
    margin:0;
    font-size:15.5px;
    color:#d7e6e6;
    max-width:560px;
    line-height:1.7;
  }
  .hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;}
  .countdown{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .countdown .cbox{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;
    padding:10px 16px;
    text-align:center;
    min-width:66px;
  }
  .countdown .cbox .cnum{
    font-family:'JetBrains Mono',monospace;
    font-size:24px;
    font-weight:700;
    color:#fff;
    line-height:1;
  }
  .countdown .cbox .clabel{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#9fd0d6;
    margin-top:4px;
  }
  .countdown-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#9fd0d6;
    margin-bottom:8px;
  }
  .chip{
    font-family:'JetBrains Mono',monospace;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.28);
    padding:7px 14px;
    border-radius:999px;
    font-size:12px;
    color:#fff;
    display:flex;align-items:center;gap:6px;
  }
  .stamp{
    flex-shrink:0;width:118px;height:118px;
    border:2.5px dashed rgba(255,201,113,0.85);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    margin-top:4px;
  }
  .stamp-inner{
    width:96px;height:96px;
    border:1px solid rgba(255,201,113,0.6);
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    color:#ffd98f;font-family:'JetBrains Mono',monospace;
  }
  .stamp-inner .top{font-size:9px;letter-spacing:.14em;text-transform:uppercase;}
  .stamp-inner .mid{font-family:'Chonburi',cursive;font-size:20px;color:#fff;margin:2px 0;}
  .stamp-inner .bottom{font-size:8.5px;letter-spacing:.14em;margin-top:2px;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  .perf{max-width:1080px;margin:0 auto;padding:0 24px;position:relative;height:0;}
  .perf::before{content:"";display:block;height:0;border-top:2px dashed var(--line-strong);margin:0 34px;position:relative;top:-11px;}
  .perf .hole{position:absolute;top:-22px;width:22px;height:22px;border-radius:50%;background:var(--paper);}
  .perf .hole.l{left:14px;}
  .perf .hole.r{right:14px;}

  /* ===== Ticket ===== */
  .ticket{
    margin-top:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 16px 32px rgba(11,37,48,0.14);
    position:relative;z-index:2;
    display:grid;grid-template-columns:1fr 1fr;
    overflow:hidden;
  }
  @media (max-width:680px){.ticket{grid-template-columns:1fr;}}
  .ticket .leg{padding:20px 26px;position:relative;}
  .ticket .leg + .leg{border-left:2px dashed var(--line-strong);}
  @media (max-width:680px){.ticket .leg + .leg{border-left:none;border-top:2px dashed var(--line-strong);}}
  .ticket .plane{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
    background:var(--card);width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    border:2px dashed var(--line-strong);z-index:1;
  }
  @media (max-width:680px){.ticket .plane{transform:translate(-50%,-50%) rotate(180deg);}}
  .ticket .leg-label{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--vermillion-dark);background:#fbe7de;padding:2px 9px;border-radius:5px;
    display:inline-block;margin-bottom:8px;font-weight:700;
  }
  .ticket .route{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .ticket .meta{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .ticket .warn{color:var(--vermillion-dark);font-weight:600;}
  .ticket .barcode{
    grid-column:1/-1;height:22px;
    background-image:repeating-linear-gradient(to right, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 11px);
    opacity:.55;margin:0 26px 16px;
  }

  /* ===== Tabs ===== */
  .tabs{display:flex;gap:10px;margin:32px 0 18px;flex-wrap:wrap;}
  .tab{
    font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:13px;
    padding:9px 18px 9px 14px;border-radius:10px;border:1.5px solid var(--line-strong);
    background:var(--card);color:var(--ink-soft);cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    box-shadow:0 1px 3px rgba(11,37,48,0.06);
    display:flex;align-items:baseline;gap:7px;
  }
  .tab:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(11,37,48,0.14);}
  .tab .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;opacity:.65;letter-spacing:.04em;}
  .tab.active{color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(11,37,48,0.22);}
  .tab.active .num{opacity:.85;color:#fff;}

  /* ===== Map + panel ===== */
  .planner{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:10px;}
  @media (max-width:900px){.planner{grid-template-columns:1fr;}}
  .map-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 12px 28px rgba(11,37,48,0.14);border:1px solid var(--line);}
  #map{height:520px;width:100%;}
  .map-caption{
    padding:11px 16px;font-size:12.5px;color:var(--ink-soft);background:var(--card);
    border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:8px;font-family:'JetBrains Mono',monospace;
  }
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  .day-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 0;max-height:640px;overflow-y:auto;box-shadow:0 12px 28px rgba(11,37,48,0.10);}
  .day-panel-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;}
  .day-panel-head .day-title{font-family:'Chonburi',cursive;font-size:18px;margin:0 0 3px;}
  .day-panel-head .day-date{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

  .stop{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:14px 20px 16px;border-bottom:1px solid #efe4c2;cursor:pointer;transition:background .12s ease;}
  .stop:last-child{border-bottom:none;}
  .stop:hover{background:#f6ecc9;}
  .stop .marker-num{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;margin-top:2px;}
  .stop .thumb{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block;background:#e9e0c4;box-shadow:0 4px 10px rgba(11,37,48,0.14);}
  .stop .body .time{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px;color:var(--vermillion-dark);margin-bottom:3px;letter-spacing:.02em;}
  .stop .body .name{font-weight:600;font-size:14.5px;margin-bottom:1px;}
  .stop .body .type-badge{display:inline-block;font-size:10px;padding:2px 9px;border-radius:999px;background:#e6eef0;color:var(--indigo-2);margin-bottom:5px;font-family:'JetBrains Mono',monospace;letter-spacing:.03em;}
  .stop .body .detail{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .stop.hotel .name::before{content:"🏨 ";}

  /* ===== Section heads ===== */
  .section-head{margin:56px 0 20px;}
  .section-head .eyebrow2{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--vermillion-dark);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;
  }
  .section-head .eyebrow2::before{content:"";width:18px;height:2px;background:var(--vermillion);display:inline-block;}
  .section-head h2{font-size:24px;margin:0 0 8px;}
  .section-head p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:640px;line-height:1.65;}

  /* ===== Zones ===== */
  .zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:8px;}
  @media (max-width:560px){.zones{grid-template-columns:1fr;}}
  .zone-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 18px rgba(11,37,48,0.08);display:flex;flex-direction:column;gap:8px;transition:transform .15s ease, box-shadow .15s ease;}
  .zone-card:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(11,37,48,0.14);}
  .zone-card .night{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 10px;border-radius:999px;width:fit-content;}
  .zone-card h3{margin:2px 0 0;font-size:16px;font-weight:700;}
  .zone-card .why{font-size:13px;color:var(--ink-soft);line-height:1.6;flex:1;}
  .zone-card .examples{font-size:11.5px;color:var(--indigo-2);font-weight:600;border-top:1px dashed var(--line-strong);padding-top:9px;font-family:'JetBrains Mono',monospace;}

  /* ===== Weather quick-links ===== */
  .weather-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 22px;
    box-shadow:0 8px 18px rgba(11,37,48,0.08);
    margin-bottom:28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }
  .weather-card .wtext{flex:1;min-width:220px;}
  .weather-card .wtext h4{margin:0 0 3px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .weather-card .wtext p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .weather-btns{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .weather-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    text-decoration:none;
    padding:9px 16px;
    border-radius:10px;
    border:1.5px solid var(--line-strong);
    background:var(--card);
    color:var(--indigo-2);
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .weather-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(11,37,48,0.14);border-color:var(--indigo-2);}

  /* ===== Food to try ===== */
  .food-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:8px;}
  @media (max-width:560px){.food-grid{grid-template-columns:1fr;}}
  .food-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 8px 18px rgba(11,37,48,0.08);transition:transform .15s ease, box-shadow .15s ease;}
  .food-card:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(11,37,48,0.14);}
  .food-card .femoji{font-size:26px;margin-bottom:6px;display:block;}
  .food-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;}
  .food-card .fname-alt{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .food-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.55;}

  /* ===== Driving tips ===== */
  .driving-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:8px;}
  @media (max-width:820px){.driving-grid{grid-template-columns:1fr;}}
  .driving-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 8px 18px rgba(11,37,48,0.08);}
  .driving-card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .driving-card ul{margin:0;padding:0;list-style:none;}
  .driving-card li{font-size:13px;color:var(--ink-soft);line-height:1.6;padding:7px 0;border-bottom:1px solid #efe4c2;}
  .driving-card li:last-child{border-bottom:none;}

  /* ===== Emergency info ===== */
  .emergency-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:8px;}
  @media (max-width:560px){.emergency-grid{grid-template-columns:1fr;}}
  .emg-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 8px 18px rgba(11,37,48,0.08);border-left:4px solid var(--vermillion);}
  .emg-card h3{margin:0 0 4px;font-size:14px;font-weight:700;}
  .emg-card .enum{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--vermillion-dark);margin:2px 0 6px;}
  .emg-card p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.55;}

  /* ===== Checklist ===== */
  .checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:820px){.checklist-grid{grid-template-columns:1fr;}}
  .check-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 8px 18px rgba(11,37,48,0.08);}
  .check-card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;font-weight:700;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #efe4c2;font-size:13.5px;}
  .check-item:last-child{border-bottom:none;}
  .check-item input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--vermillion);flex-shrink:0;cursor:pointer;}
  .check-item label{cursor:pointer;line-height:1.6;}
  .check-item .note{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;}
  .check-item.checked label{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:#c7b98a;}

  footer{margin-top:64px;padding:26px 24px 44px;text-align:center;font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  footer a{color:var(--indigo-2);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;}
  .leaflet-popup-content{font-family:'IBM Plex Sans Thai','Noto Sans JP',sans-serif;font-size:13px;}
  .leaflet-popup-content b{font-family:'IBM Plex Sans Thai',sans-serif;}

  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeSlideIn .32s ease both;}
</style>
</head>
<body>

<div class="langbar" id="langbar">
  <button class="langbtn" data-lang="th">ไทย</button>
  <button class="langbtn" data-lang="en">EN</button>
  <button class="langbtn" data-lang="jp">日本語</button>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <div class="eyebrow" id="t-eyebrow"></div>
      <h1 id="t-h1"></h1>
      <p class="sub" id="t-sub"></p>
      <div class="hero-meta" id="t-chips"></div>
      <div id="countdownBox"></div>
    </div>
    <div class="stamp">
      <div class="stamp-inner">
        <div class="top" id="t-stamp-top"></div>
        <div class="mid" id="t-stamp-mid"></div>
        <div class="bottom" id="t-stamp-bottom"></div>
      </div>
    </div>
  </div>
</div>

<div class="perf"><span class="hole l"></span><span class="hole r"></span></div>

<div class="wrap">

  <div class="ticket">
    <div class="leg">
      <span class="leg-label" id="t-leg1-label"></span>
      <div class="route">DMK <span style="opacity:.4">✈</span> OKA</div>
      <p class="meta" id="t-leg1-meta"></p>
    </div>
    <div class="plane">✈</div>
    <div class="leg">
      <span class="leg-label" id="t-leg2-label"></span>
      <div class="route">OKA <span style="opacity:.4">✈</span> DMK</div>
      <p class="meta" id="t-leg2-meta"></p>
    </div>
    <div class="barcode"></div>
  </div>

  <div class="section-head">
    <div class="eyebrow2" id="t-sec1-eyebrow"></div>
    <h2 id="t-sec1-h2"></h2>
    <p id="t-sec1-p"></p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="planner">
    <div class="map-card">
      <div id="map"></div>
      <div class="map-caption">
        <span id="mapCaptionLeft"></span>
        <span id="mapCaptionRight"></span>
      </div>
    </div>
    <div class="day-panel" id="dayPanel"></div>
  </div>

  <div class="section-head">
    <div class="eyebrow2" id="t-sec2-eyebrow"></div>
    <h2 id="t-sec2-h2"></h2>
    <p id="t-sec2-p"></p>
  </div>
  <div class="zones" id="zones"></div>

  <div class="section-head">

/* ============ MAP SETUP ============ */
const map = L.map('map', {zoomControl:true, scrollWheelZoom:false}).setView([26.45,127.9], 9.2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);
let currentLayer = L.layerGroup().addTo(map);

function makeIcon(color, num, hotel){
  return L.divIcon({
    className:'',
    html:`<div style="background:${color};width:${hotel?30:26}px;height:${hotel?30:26}px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:${hotel?14:12}px;">${hotel?'🏨':num}</div>`,
    iconSize:[hotel?30:26,hotel?30:26], iconAnchor:[hotel?15:13,hotel?15:13]
  });
}

let currentDayIdx = 0;

function renderDay(dayIdx){
  const day = days[dayIdx];
  const color = DAY_COLORS[day.id];

  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', i===dayIdx);
    t.style.background = i===dayIdx ? DAY_COLORS[i+1] : 'var(--card)';
    t.style.borderColor = i===dayIdx ? DAY_COLORS[i+1] : 'var(--line-strong)';
  });

  currentLayer.clearLayers();
  const latlngs = [];
  day.stops.forEach((s,i)=>{
    const marker = L.marker([s.lat,s.lng], {icon: makeIcon(color, i+1, s.hotel)}).addTo(currentLayer);
    const mainName = T(s.name);
    const popupImg = s.img ? `<img src="${s.img}" referrerpolicy="no-referrer" onerror="this.style.display='none';" style="width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block;">` : '';
    marker.bindPopup(`${popupImg}<b>${s.time} — ${mainName}</b><br>${T(s.detail)}`, {maxWidth:260});
    marker.on('click', ()=> highlightStop(i));
    if(s.lat>24 && s.lat<30) latlngs.push([s.lat,s.lng]);
  });
  if(latlngs.length>1){
    L.polyline(latlngs, {color:color, weight:3, opacity:0.55, dashArray:'6,6'}).addTo(currentLayer);
    map.flyToBounds(latlngs, {padding:[36,36], maxZoom:13, duration:0.6});
  } else if(latlngs.length===1){
    map.flyTo(latlngs[0], 12, {duration:0.6});
  }

  document.getElementById('mapCaptionLeft').textContent = `${T(UI.dayLabel)} ${day.id} — ${T(day.date)}`;
  document.getElementById('mapCaptionRight').innerHTML = `<span class="legend-dot" style="background:${color}"></span>${T(day.theme)}`;

  const panel = document.getElementById('dayPanel');
  panel.innerHTML = `
    <div class="day-panel-head fade-in">
      <div class="day-title" style="color:${color}">${T(UI.dayLabel)} ${day.id} · ${T(day.theme)}</div>
      <div class="day-date">${T(day.date)}</div>
    </div>
    ${day.stops.map((s,i)=>{
      const mainName = T(s.name);
      return `
      <div class="stop fade-in ${s.hotel?'hotel':''}" data-idx="${i}" style="animation-delay:${i*0.03}s">
        <div class="marker-num" style="background:${color}">${s.hotel?'🏨':i+1}</div>
        <div class="body">
          ${s.img?`<img class="thumb" src="${s.img}" alt="${mainName}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.style.display='none';">`:''}
          <div class="time">${s.time}</div>
          <div class="name">${mainName}</div>
          <div class="type-badge">${UI.typeBadge[LANG][s.type]}</div>
          <div class="detail">${T(s.detail)}</div>
        </div>
      </div>
    `;}).join('')}
  `;
  panel.querySelectorAll('.stop').forEach(el=>{
    el.addEventListener('click', ()=> highlightStop(parseInt(el.dataset.idx)));
  });
}

function highlightStop(i){
  const s = days[currentDayIdx].stops[i];
  if(s.lat>24 && s.lat<30) map.flyTo([s.lat,s.lng], 14, {duration:0.5});
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  days.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.innerHTML = `<span class="num">${T(UI.dayLabel)}</span>${d.id}`;
    btn.title = T(d.theme);
    btn.addEventListener('click', ()=>{ currentDayIdx = i; renderDay(i); });
    tabsEl.appendChild(btn);
  });
}

      <div class="why">${T(z.why)}</div>

function renderChecklists(){
  document.getElementById('checklists').innerHTML = checklists.map(group=>`
    <div class="check-card">
      <h3>${T(group.title)}</h3>
      ${group.items.map(it=>`
        <div class="check-item" id="wrap-${it.id}">
          <input type="checkbox" id="${it.id}">
          <label for="${it.id}">${T(it.label)}${it.note?`<span class="note">${T(it.note)}</span>`:''}</label>
        </div>
      `).join('')}
    </div>
  `).join('');

  document.querySelectorAll('.check-item input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', async (e)=>{
      e.target.closest('.check-item').classList.toggle('checked', e.target.checked);
      try{ await window.storage.set(`okinawa-check:${e.target.id}`, String(e.target.checked)); }catch(err){}
    });
  });
  loadChecklist();
}

async function loadChecklist(){
  for(const group of checklists){
    for(const it of group.items){
      try{
        const res = await window.storage.get(`okinawa-check:${it.id}`);
        if(res && res.value === 'true'){
          const cb = document.getElementById(it.id);
          if(cb){ cb.checked = true; document.getElementById(`wrap-${it.id}`).classList.add('checked'); }
        }
      }catch(e){}
    }
  }
}

/* ============ COUNTDOWN ============ */
const TRIP_DEPARTURE = new Date('2026-08-13T08:25:00+07:00');
function renderCountdown(){
  updateCountdown();
}
function updateCountdown(){
  const box = document.getElementById('countdownBox');
  if(!box) return;
  const now = new Date();
  const diff = TRIP_DEPARTURE - now;
  if(diff <= 0){
    box.innerHTML = `<div class="countdown-label">${T(UI.countdown.departed)}</div>`;
    return;
  }
  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff / (1000*60*60)) % 24);
  const m = Math.floor((diff / (1000*60)) % 60);
  const s = Math.floor((diff / 1000) % 60);
  box.innerHTML = `
    <div class="countdown-label">${T(UI.countdown.label)}</div>
    <div class="countdown">
      <div class="cbox"><div class="cnum">${d}</div><div class="clabel">${T(UI.countdown.days)}</div></div>
      <div class="cbox"><div class="cnum">${h}</div><div class="clabel">${T(UI.countdown.hours)}</div></div>
      <div class="cbox"><div class="cnum">${m}</div><div class="clabel">${T(UI.countdown.mins)}</div></div>
      <div class="cbox"><div class="cnum">${s}</div><div class="clabel">${T(UI.countdown.secs)}</div></div>
    </div>
  `;
}
setInterval(updateCountdown, 1000);

});

    if(res && res.value && ['th','en','jp'].includes(res.value)) LANG = res.value;
  }catch(e){}
  renderAll();
}
initLang();
