<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Travel Calendar · ปฏิทินฤดูเที่ยวโลก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#142029; --ink2:#1b2c39; --ink3:#243a4b;
  --paper:#FBF8F1; --paper2:#efe7d6; --paper3:#e3d8c0;
  --brass:#c08a2e; --brass-soft:#e8c98a; --brass-tint:rgba(192,138,46,.16);
  --line:rgba(255,255,255,.10);
  --txt:#f3ecdd; --txt-dim:#b9c4cd;
  --g-fill:#bfe0c0; --g-txt:#1B5E20;
  --a-fill:#f0d27e; --a-txt:#6b4400;
  --r-fill:#e6a3a3; --r-txt:#7d1414;
  --shadow:0 6px 20px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,sans-serif;background:var(--ink);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.5}
body.th{font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

header.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#101a22,#142029);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.3)}
.top-in{max-width:1080px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{font-family:"Trirong",serif;font-weight:700;font-size:18px;margin:0;color:var(--paper);white-space:nowrap}
.brand .sub{font-size:12.5px;color:var(--txt-dim);white-space:nowrap}
.brand .compass{color:var(--brass);font-size:16px;transform:translateY(1px)}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;background:#0d161d;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{font:inherit;font-size:12px;font-weight:700;color:var(--txt-dim);background:none;border:0;padding:3px 11px;border-radius:999px;cursor:pointer;letter-spacing:.4px}
.lang button.on{background:var(--paper);color:var(--ink)}
.modes{display:flex;background:#0d161d;border:1px solid var(--line);border-radius:999px;padding:2px}
.modes button{font:inherit;font-size:12.5px;font-weight:600;color:var(--txt-dim);background:none;border:0;padding:4px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--brass);color:#1a130a}

.hero{padding:22px 0 6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.hero .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--brass-soft);font-weight:600}
.hero h2{font-family:"Trirong",serif;font-weight:700;font-size:clamp(30px,6.5vw,46px);margin:.06em 0 .04em;color:var(--paper);line-height:1}
.hero .lead{font-size:15px;color:var(--txt-dim)}
.hero .lead b{color:var(--g-txt);background:var(--g-fill);padding:0 6px;border-radius:5px;font-weight:700}

.months{display:flex;gap:7px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.months button{font:inherit;flex:0 0 auto;font-size:14px;font-weight:600;color:var(--txt-dim);background:#0e1820;border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;transition:.12s}
.months button:hover{border-color:var(--brass)}
.months button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--txt-dim);background:#0e1820;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--brass)}
.chip.on{background:var(--brass);color:#1a130a;border-color:var(--brass);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
select,input[type=search]{font:inherit;font-size:13.5px;color:var(--txt);background:#0e1820;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
input[type=search]{min-width:170px;flex:1}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--txt-dim);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
.metabar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 2px 0}
.count-note{font-size:12.5px;color:var(--txt-dim)}
.collapse-all{font:inherit;font-size:12.5px;color:var(--brass-soft);background:none;border:0;cursor:pointer;font-weight:600}
.collapse-all:hover{text-decoration:underline}

.rgroup{margin-top:24px}
.rhead{display:flex;align-items:center;gap:10px;margin:0 2px 12px;cursor:pointer;user-select:none}
.rhead .chev{color:var(--brass);font-size:13px;width:14px;transition:transform .15s;display:inline-block}
.rhead.collapsed .chev{transform:rotate(-90deg)}
.rhead h3{font-family:"Trirong",serif;font-weight:600;font-size:19px;color:var(--paper);margin:0}
.rhead .n{font-size:12px;color:var(--brass-soft);font-weight:600;background:#0e1820;border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.rhead .bar{height:1px;background:var(--line);flex:1}
.rhead:hover h3{color:var(--brass-soft)}
.chead{display:flex;align-items:center;gap:8px;margin:14px 2px 9px 20px;cursor:pointer;user-select:none}
.chead .chev{color:var(--brass);font-size:11px;width:12px;transition:transform .15s;display:inline-block;opacity:.85}
.chead.collapsed .chev{transform:rotate(-90deg)}
.chead .cn{font-weight:700;font-size:13.5px;color:var(--brass-soft);letter-spacing:.2px}
.chead .n2{font-size:11px;color:var(--txt-dim);background:#0e1820;border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.chead:hover .cn{color:var(--paper)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-left:38px}
.card{background:linear-gradient(180deg,#1e2e3b,#1a2935);color:var(--txt);border-radius:14px;padding:13px 14px 12px;cursor:pointer;border:1px solid rgba(232,201,138,.13);transition:.14s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brass)}
.card .cname{font-weight:700;font-size:15px;line-height:1.25;color:var(--paper)}
.card .cbest{font-size:12px;color:var(--txt-dim);margin-top:2px}
.card .hl{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:13px;font-weight:600;background:rgba(192,138,46,.15);border:1px solid rgba(192,138,46,.28);border-radius:8px;padding:4px 9px;color:var(--brass-soft)}
.card .badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.b3{background:var(--g-fill);color:var(--g-txt)} .b2{background:var(--a-fill);color:var(--a-txt)} .b1{background:var(--r-fill);color:var(--r-txt)}
.ribbon{display:flex;gap:2px;margin-top:11px}
.ribbon i{flex:1;height:8px;border-radius:2px;display:block}
.ribbon i.cur{outline:2px solid var(--brass);outline-offset:1px}
.s3{background:#7cc47f} .s2{background:#e6bd4d} .s1{background:#d98686}

.hwrap{overflow:auto;max-height:calc(100vh - 208px);min-height:300px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--ink2)}
table.heat{border-collapse:collapse;width:100%;min-width:780px;font-size:12.5px}
.heat th,.heat td{padding:0;text-align:center}
.heat thead th{position:sticky;top:0;z-index:5;background:var(--ink3);color:var(--paper);font-weight:600;padding:9px 4px;border-bottom:1px solid var(--line)}
.heat thead th:first-child{text-align:left;padding-left:14px;position:sticky;left:0;z-index:6;background:var(--ink3)}
.heat thead th::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-2px;height:3px;background:var(--ink3);pointer-events:none}
.heat td.city{text-align:left;padding:9px 12px 9px 30px;color:var(--paper);font-weight:600;white-space:nowrap;position:sticky;left:0;z-index:2;background:var(--ink3);border-right:1px solid var(--line);border-top:1px solid transparent;border-bottom:1px solid transparent;box-shadow:6px 0 10px -8px rgba(0,0,0,.55);cursor:pointer;font-size:13px}
.heat td.m{width:54px;height:34px;font-weight:700;cursor:pointer;border:1px solid rgba(20,32,41,.10)}
.heat td.m.v3{background:var(--g-fill);color:var(--g-txt)}
.heat td.m.v2{background:var(--a-fill);color:var(--a-txt)}
.heat td.m.v1{background:var(--r-fill);color:var(--r-txt)}
.heat td.m.cur{box-shadow:inset 2px 0 0 var(--brass),inset -2px 0 0 var(--brass)}
.heat tr.crow:hover td.m.cur{box-shadow:inset 0 0 0 1px var(--brass),inset 2px 0 0 var(--brass),inset -2px 0 0 var(--brass)}
.heat tr.crow.focus td.m.cur{box-shadow:inset 0 0 0 2px var(--brass)}
.heat thead th.mh{cursor:pointer;transition:color .12s,box-shadow .12s}
.heat thead th.mh.sel{color:var(--brass);box-shadow:inset 0 -3px 0 var(--brass)}
.heat td.city .info{margin-left:7px;font-size:12px;color:var(--brass);opacity:0;pointer-events:none;cursor:pointer;transition:opacity .12s}
.heat tr.crow.focus td.m{box-shadow:inset 0 0 0 2px var(--brass)}
.heat tr.crow.focus td.city{background:var(--ink3);box-shadow:inset 0 0 0 2px var(--brass),6px 0 10px -8px rgba(0,0,0,.55)}
.heat tr.crow.focus td.city .info{opacity:.85;pointer-events:auto}
@media (hover:hover){
.heat tr.crow:hover td.m{box-shadow:inset 0 0 0 1px var(--brass)}
.heat tr.crow:hover td.city{background:var(--ink3);box-shadow:inset 0 0 0 1px var(--brass),6px 0 10px -8px rgba(0,0,0,.55)}
.heat thead th.mh:hover{color:var(--brass)}
.heat td.city:hover{color:var(--brass-soft)}
.heat tr.crow:hover td.city .info{opacity:.85;pointer-events:auto}
.heat td.city .info:hover{opacity:1}
.heat tr.ccap:hover td{box-shadow:inset 3px 0 0 var(--brass)}
}
#heatMonthRow{display:none}
.heat tr.hide{display:none}
.mvisa{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:11.5px;font-weight:700;letter-spacing:.1px;border-radius:999px;padding:4px 11px;margin:11px 0 0;border:1px solid}
.mvisa.free{background:rgba(102,187,106,.13);color:#b2dfb4;border-color:rgba(178,223,180,.4)}
.mvisa.voa{background:rgba(255,183,77,.13);color:#ffd8a1;border-color:rgba(255,216,161,.38)}
.mvisa.req{background:rgba(255,255,255,.045);color:var(--txt-dim);border-color:rgba(255,255,255,.14)}
.mvisa.home{background:rgba(192,138,46,.14);color:var(--brass-soft);border-color:rgba(232,201,138,.3)}
.mvsub{font-size:11px;color:var(--txt-dim);opacity:.8;margin-top:5px;line-height:1.5;letter-spacing:.1px}
.msrc{font-size:10px;color:var(--txt-dim);opacity:.55;margin-top:10px;line-height:1.6;letter-spacing:.1px}
.vb{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:8px;border:1px solid;white-space:nowrap}
.vb.free{background:rgba(76,175,80,.16);color:#a5d6a7;border-color:rgba(165,214,167,.3)}
.vb.voa{background:rgba(255,167,38,.16);color:#ffcc80;border-color:rgba(255,204,128,.3)}
.vb.req{background:rgba(255,255,255,.05);color:var(--txt-dim);border-color:var(--line)}
.vb.home{background:rgba(192,138,46,.16);color:var(--brass-soft);border-color:rgba(232,201,138,.28)}
.chead .vb{margin-left:10px}
.tools select#visaSel,.tools select#visaSelH{max-width:190px}
.heat tr.conhead td{background:var(--ink);color:var(--brass-soft);text-align:left;padding:9px 14px 9px 10px;font-weight:700;font-size:13px;letter-spacing:.3px;cursor:pointer;user-select:none;border-top:1px solid var(--line);position:sticky;top:37px;z-index:4}
.heat tr.conhead .chev{display:inline-block;width:14px;color:var(--brass);transition:transform .15s}
.heat tr.conhead.collapsed .chev{transform:rotate(-90deg)}
.heat tr.conhead .n{font-weight:600;color:var(--txt-dim);font-size:11.5px}
.heat tr.ccap td{background:var(--ink3);color:var(--txt-dim);text-align:left;padding:6px 14px 6px 20px;font-weight:600;font-size:12px;cursor:pointer;user-select:none;position:sticky;top:75px;z-index:3}
.heat tr.ccap .chev{display:inline-block;width:12px;color:var(--brass);transition:transform .15s}
.heat tr.ccap.collapsed .chev{transform:rotate(-90deg)}
.heat tr.ccap .n{color:var(--txt-dim);font-weight:600;font-size:11px}
.heat tr.ccap:hover td{color:var(--brass-soft)}
.heat tr.conhead .hstick{position:sticky;left:10px;display:inline-block}
.heat tr.ccap .hstick{position:sticky;left:20px;display:inline-block}
#viewHeat .months{padding:10px 0 4px}
#viewHeat .tools{margin:4px 0 2px}

.scrim{position:fixed;inset:0;background:rgba(8,12,16,.66);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.scrim.show{display:flex}
.modal{background:linear-gradient(180deg,#20303e,#172530);color:var(--txt);border:1px solid rgba(232,201,138,.2);max-width:560px;width:100%;border-radius:20px;padding:24px 24px 20px;box-shadow:0 30px 70px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.25);max-height:88vh;overflow:auto;position:relative;animation:mIn .18s ease-out}
@keyframes mIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h3{font-family:"Trirong",serif;font-weight:700;font-size:27px;margin:0;line-height:1.12;letter-spacing:-.2px;color:var(--paper);padding-right:44px}
.modal .mbest{font-size:13.5px;color:var(--paper);font-weight:600;margin-top:10px;letter-spacing:.1px}
.modal .mreg{display:block;font-size:10.5px;color:var(--brass);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-top:7px}
.yearbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:18px 0 4px}
.yb{border-radius:7px;padding:6px 0 7px;text-align:center}
.yb .mn{font-size:9.5px;font-weight:700;letter-spacing:.3px;opacity:.7}
.yb .em{font-size:14px;line-height:1.5;min-height:20px}
.yb.v3{background:var(--g-fill);color:var(--g-txt)} .yb.v2{background:var(--a-fill);color:var(--a-txt)} .yb.v1{background:var(--r-fill);color:var(--r-txt)}
.yb.cur{outline:2px solid var(--brass);outline-offset:1px}
.msum{font-size:13px;color:var(--txt);background:rgba(10,18,24,.4);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:11px 14px;margin-top:12px;line-height:1.65}
.msum .k{font-weight:700;color:var(--brass-soft);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.mnote{font-size:13px;color:var(--txt);background:rgba(10,18,24,.28);border-left:2px solid var(--brass);border-radius:0 12px 12px 0;padding:11px 14px;margin-top:10px;line-height:1.7}
.mnote .lbl{display:block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--brass-soft);font-weight:700;margin-bottom:5px;opacity:.9}
.mhls{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.mhls span{font-size:12px;background:rgba(192,138,46,.1);border:1px solid rgba(232,201,138,.2);border-radius:999px;padding:4px 11px;color:var(--paper);font-weight:600}
.mlegend{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--txt-dim);margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);letter-spacing:.2px}
.mlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.msights{margin-top:16px}
.msights .slbl{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:8px}
.msights .sg{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(10,18,24,.4);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 12px;margin:0 6px 7px 0;color:var(--paper);font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .14s,color .14s,background .14s,transform .14s}
.msights a.sg:hover{border-color:rgba(232,201,138,.55);color:var(--brass-soft);background:rgba(192,138,46,.12);transform:translateY(-1px)}
.msights a.sg:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.msights .sg{transition:none}.msights a.sg:hover{transform:none}}
.msights .sg .ext{font-size:9px;opacity:.45;margin-left:1px}
.msights a.sg:hover .ext{opacity:.9}
.mtools{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:2px;z-index:2}
.x{font-size:22px;color:var(--txt-dim);cursor:pointer;background:none;border:0;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--paper);background:rgba(255,255,255,.06)}
.x:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.modal:focus{outline:none}

.empty{text-align:center;color:var(--txt-dim);padding:50px 20px;font-size:15px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--txt-dim);line-height:1.7}
footer b{color:var(--brass-soft)}
footer .fupd{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;opacity:.8;letter-spacing:.2px}
.hide{display:none!important}
@media (max-width:560px){.brand .sub{display:none}.brand h1{font-size:16px}.compass{font-size:14px}.wrap{padding-left:12px;padding-right:12px}.top-in{padding-left:12px;padding-right:12px}.hero{padding:20px 0 6px;margin-bottom:12px}.hero .lead{font-size:14px}.scrim{padding:10px}.modal{padding:18px}.chead{margin-left:12px}.cards{grid-template-columns:1fr 1fr;gap:9px;margin-left:18px}.card{padding:11px}.card .cname{font-size:13.5px}.modes button{padding:5px 9px;font-size:11.5px}.lang button{padding:5px 10px}.right{gap:7px}.top-in{gap:8px}}
@media (max-width:560px){.hwrap{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="compass">&#10038;</span><h1 id="brandTitle"></h1><span class="sub" id="brandsub"></span></div>
    <div class="right">
      <div class="lang">
        <button id="lEN" class="on" onclick="setLang('en')">EN</button>
        <button id="lTH" onclick="setLang('th')">&#3652;&#3607;&#3618;</button>
      </div>
      <div class="modes">
        <button id="mA" class="on" onclick="setMode('month')"></button>
        <button id="mB" onclick="setMode('heatmap')"></button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="viewMonth">
    <div class="hero">
      <div class="eyebrow" id="ebA"></div>
      <h2 id="heroMonth">&mdash;</h2>
      <div class="lead" id="heroLead"></div>
    </div>
    <div class="months" id="monthRow"></div>
    <div class="filters" id="interestRow"></div>
    <div class="tools">
      <select id="regionSel" onchange="render()"></select>
      <select id="visaSel" onchange="render()"></select>
      <input type="search" id="searchBox" oninput="render()">
      <label class="toggle"><input type="checkbox" id="incOk" onchange="render()"> <span id="incOkL"></span></label>
    </div>
    <div class="metabar"><div class="count-note" id="countNote"></div><button class="collapse-all" id="collA" onclick="toggleAll('month')"></button></div>
    <div id="results"></div>
  </section>

  <section id="viewHeat" class="hide">
    <div class="hero">
      <div class="eyebrow" id="ebB"></div>
      <h2 id="heatTitle"></h2>
      <div class="lead" id="heatLead"></div>
      <div class="months" id="heatMonthRow"></div>
    </div>
    <div class="tools">
      <select id="heatRegion" onchange="renderHeat()"></select>
      <select id="visaSelH" onchange="renderHeat()"></select>
      <input type="search" id="heatSearch" oninput="renderHeat()">
      <button class="collapse-all" id="collB" onclick="toggleAll('heat')" style="margin-left:auto"></button>
    </div>
    <div class="hwrap"><table class="heat" id="heatTable"></table></div>
  </section>

  <footer><div id="foot1"></div><div id="foot2" style="margin-top:6px"></div><div id="foot3" class="fupd"></div></footer>

    b.onclick=()=>pickMonth(i);row.appendChild(b);}}
function buildHeatMonths(){const row=document.getElementById("heatMonthRow");row.innerHTML="";
  for(let i=0;i<12;i++){const b=document.createElement("button");b.textContent=ab(i);if(i===selMonth)b.classList.add("on");
    b.onclick=()=>pickMonth(i);row.appendChild(b);}}
function pickMonth(i){selMonth=i;buildMonths();buildHeatMonths();if(mode==="heatmap")updateHeatMonth();else render();}
function focusRow(idx){const was=focusCity===idx;focusCity=was?null:idx;document.querySelectorAll('#heatTable tr.crow.focus').forEach(tr=>tr.classList.remove('focus'));if(!was){const tr=document.querySelector('#heatTable tr.crow[data-idx="'+idx+'"]');if(tr)tr.classList.add('focus');}}
function buildInterests(){const row=document.getElementById("interestRow");row.innerHTML="";
  CATS.forEach(cat=>{const b=document.createElement("button");b.className="chip";b.textContent=lang==="en"?cat.en:cat.th;
    if(interests.has(cat.key))b.classList.add("on");
    b.onclick=()=>{interests.has(cat.key)?interests.delete(cat.key):interests.add(cat.key);buildInterests();render();};row.appendChild(b);});}
function buildRegionSelects(){const t=L();
  const a=document.getElementById("regionSel");const av=a.value;
  a.innerHTML=`<option value="all">${t.allRegions}</option>`+DATA.regions.map(r=>`<option value="${r.name}">${regName(r)}</option>`).join("");
  if(av)a.value=av;
  const h=document.getElementById("heatRegion");const hv=h.value;
  h.innerHTML=`<option value="all">${t.allRegions}</option>`+DATA.regions.map(r=>`<option value="${r.name}">${regName(r)}</option>`).join("");
  if(hv)h.value=hv;}

function ribbon(r,cur){return '<div class="ribbon">'+r.map((v,i)=>`<i class="s${v}${i===cur?' cur':''}"></i>`).join("")+'</div>';}

function render(){if(mode!=="month")return;const t=L();
  const incOk=document.getElementById("incOk").checked;
  const reg=document.getElementById("regionSel").value;
  const q=document.getElementById("searchBox").value.trim().toLowerCase();
  const vf=visaFilter("visaSel");
  persist();
  document.getElementById("heroMonth").textContent=full(selMonth);
  const match=c=>{
    if(q&&!(( (c.city||"")+" "+(c.cityEn||"")+" "+(c.cnTh||"")+" "+(c.cnEn||"")+" "+(c.region||"")+" "+(c.regionEn||"")).toLowerCase().includes(q)))return false;
    if(!q){const ok=incOk?c.r[selMonth]>=2:c.r[selMonth]===3;if(!ok)return false;}
    if(reg!=="all"&&c.region!==reg)return false;if(!visaOk(c.visa,vf))return false;if(!matchesCats(c))return false;
    return true;};
  const pool=ALL.filter(match);
  const good=ALL.filter(c=>c.r[selMonth]===3).length;
  document.getElementById("heroLead").innerHTML=t.leadFn(good,DATA.total,full(selMonth));
  document.getElementById("countNote").textContent=q?(lang==="en"?`${pool.length} matches for \u201c${q}\u201d \u00b7 all months`:`\u0e1e\u0e1a ${pool.length} \u0e40\u0e21\u0e37\u0e2d\u0e07\u0e08\u0e32\u0e01 \u201c${q}\u201d \u00b7 ทุกเดือน`):t.foundFn(pool.length,incOk?t.withOk:t.greatOnly);
  const byKey={};pool.forEach(c=>{const k=c.region+"@@"+c.country;(byKey[k]=byKey[k]||[]).push(c);});
  const regCount=rg=>rg.countries.reduce((s,co)=>s+((byKey[rg.name+"@@"+co.name]||[]).length),0);
  const anyOpen=DATA.regions.some(rg=>(reg==="all"||rg.name===reg)&&regCount(rg)>0&&!collapsed.has(rg.name));
  document.getElementById("collA").textContent=collLabel("month");
  const res=document.getElementById("results");
  if(pool.length===0){res.innerHTML=`<div class="empty">${t.empty}</div>`;return;}
  let html="";
  DATA.regions.forEach((rg,ri)=>{
    if(reg!=="all"&&rg.name!==reg)return;
    const rc=regCount(rg);if(rc===0)return;
    const colReg=collapsed.has(rg.name)&&!q;
    html+=`<div class="rgroup"><div class="rhead${colReg?' collapsed':''}" onclick="toggleReg('${rg.name}')"><span class="chev">\u25be</span><h3>${regName(rg)}</h3><span class="n">${rc}</span><div class="bar"></div></div>`;
    if(!colReg){
      rg.countries.forEach((co,ci)=>{
        const list=byKey[rg.name+"@@"+co.name];if(!list||!list.length)return;
        const cok=rg.name+"@@"+co.name;const colC=collapsedC.has(cok)&&!q;
        html+=`<div class="chead${colC?' collapsed':''}" onclick="toggleCountry(${ri},${ci})"><span class="chev">\u25be</span><span class="cn">${cnOf(co)}</span><span class="n2">${list.length}</span>${visaBadge(co.visa)}</div>`;
        if(!colC){html+='<div class="cards">';
          list.forEach(c=>{const rate=c.r[selMonth];
            const badge=rate===3?`<span class="badge b3">${t.great}</span>`:(rate===2?`<span class="badge b2">${t.ok}</span>`:`<span class="badge b1">${t.avoid}</span>`);
            const hv=hlOf(c,selMonth);const hl=hv?`<div class="hl">${hv}</div>`:'';
            html+=`<div class="card" onclick="openCity(${c._i})">${badge}<div class="cname">${nameOf(c)}</div><div class="cbest">${t.best} ${bestOf(c)}</div>${hl}${ribbon(c.r,selMonth)}</div>`;});
          html+='</div>';}
      });
    }
    html+="</div>";});
  res.innerHTML=html;}

function renderHeat(){const t=L();
  const reg=document.getElementById("heatRegion").value||"all";
  const q=document.getElementById("heatSearch").value.trim().toLowerCase();
  const vf=visaFilter("visaSelH");
  persist();
  const cur=selMonth;const dt=lang==="en"?"Details":"ดูรายละเอียด";const ea=x=>String(x).replace(/"/g,"&quot;");
  const inScope=rg=>reg==="all"||rg.name===reg;
  const anyOpen=DATA.regions.some(rg=>inScope(rg)&&!collapsed.has(rg.name));
  document.getElementById("collB").textContent=collLabel("heat");
  let html="<thead><tr><th>"+t.city+"</th>"+EN_ABBR.map((m,i)=>`<th class="mh${i===selMonth?' sel':''}" onclick="pickMonth(${i})" title="${full(i)}">${ab(i)}</th>`).join("")+"</tr></thead><tbody>";
  DATA.regions.forEach((rg,ri)=>{
    if(!inScope(rg))return;
    const cnt=rg.countries.reduce((s,co)=>s+(visaOk(co.visa,vf)?co.cities.filter(c=>hitsQ(c,co,rg,q)).length:0),0);
    if((q||vf!=="all")&&cnt===0)return;
    const colReg=collapsed.has(rg.name)&&!q;
    html+=`<tr class="conhead${colReg?' collapsed':''}" data-reg="${ea(rg.name)}" onclick="toggleReg('${rg.name}')"><td colspan="13"><span class="hstick"><span class="chev">\u25be</span> ${regName(rg)} <span class="n">(${cnt})</span></span></td></tr>`;
    rg.countries.forEach((co,ci)=>{if(!visaOk(co.visa,vf))return;const cs=co.cities.filter(c=>hitsQ(c,co,rg,q));if(!cs.length)return;
      const cok=rg.name+"@@"+co.name;const colC=collapsedC.has(cok)&&!q;
      html+=`<tr class="ccap${colC?' collapsed':''}${colReg?' hide':''}" data-reg="${ea(rg.name)}" data-co="${ea(cok)}" onclick="toggleCountry(${ri},${ci})"><td colspan="13"><span class="hstick"><span class="chev">\u25be</span> ${cnOf(co)} <span class="n">(${cs.length})</span>${visaBadge(co.visa)}</span></td></tr>`;
      cs.forEach(cc=>{const c=ALL[cc._i!==undefined?cc._i:ALL.findIndex(x=>x.city===cc.city)];const idx=c._i;
        html+=`<tr class="crow${idx===focusCity?' focus':''}${(colReg||colC)?' hide':''}" data-reg="${ea(rg.name)}" data-co="${ea(cok)}" data-idx="${idx}"><td class="city" onclick="focusRow(${idx})">${nameOf(c)}<span class="info" onclick="event.stopPropagation();openCity(${idx})" title="${dt}">\u24d8</span></td>`+
          c.r.map((v,i)=>{const lab=v===3?t.great:(v===2?t.ok:t.avoid);return `<td class="m v${v}${i===cur?' cur':''}" onclick="openCity(${idx})" title="${full(i)}: ${lab} \u2014 ${dt}">${v===3?'\u25cf':(v===2?'\u25cb':'\u00d7')}</td>`;}).join("")+`</tr>`;});});
  });
  html+="</tbody>";
  const hw0=document.querySelector('.hwrap');const _sl=hw0?hw0.scrollLeft:0,_st=hw0?hw0.scrollTop:0;
  document.getElementById("heatTable").innerHTML=html;
  if(hw0){hw0.scrollLeft=_sl;hw0.scrollTop=_st;}
  fitHeat();}
function fitHeat(){const hw=document.querySelector('.hwrap');if(!hw||mode!=="heatmap")return;
  const docTop=hw.getBoundingClientRect().top+window.scrollY;
  hw.style.maxHeight=Math.max(240,window.innerHeight-docTop-10)+"px";}
window.addEventListener("resize",fitHeat);

function toggleReg(name){collapsed.has(name)?collapsed.delete(name):collapsed.add(name);if(mode==="heatmap")applyCollapse();else render();}
function toggleCountry(ri,ci){const rg=DATA.regions[ri],co=rg.countries[ci];const k=rg.name+"@@"+co.name;
  collapsedC.has(k)?collapsedC.delete(k):collapsedC.add(k);if(mode==="heatmap")applyCollapse();else render();}
function collapseScope(which){const el=document.getElementById(which==="heat"?"heatRegion":"regionSel");const v=el?el.value:"all";return DATA.regions.filter(rg=>v==="all"||rg.name===v);}
function collapseLevel(which){const regs=collapseScope(which);if(!regs.length)return 0;
  if(regs.every(rg=>collapsed.has(rg.name)))return 2;
  let anyCity=false;regs.forEach(rg=>{if(!collapsed.has(rg.name))rg.countries.forEach(co=>{if(!collapsedC.has(rg.name+"@@"+co.name))anyCity=true;});});
  return anyCity?0:1;}
function collLabel(which){const t=L();const lv=collapseLevel(which);return lv===0?t.colCities:(lv===1?t.colCountries:t.expandAll);}
function toggleAll(which){const regs=collapseScope(which);const lv=collapseLevel(which);
  if(lv===0){regs.forEach(rg=>{collapsed.delete(rg.name);rg.countries.forEach(co=>collapsedC.add(rg.name+"@@"+co.name));});}
  else if(lv===1){regs.forEach(rg=>collapsed.add(rg.name));}
  else{regs.forEach(rg=>{collapsed.delete(rg.name);rg.countries.forEach(co=>collapsedC.delete(rg.name+"@@"+co.name));});}
  if(which==="heat")applyCollapse();else render();}
function applyCollapse(){const q=document.getElementById("heatSearch").value.trim().toLowerCase();
  document.querySelectorAll('#heatTable tbody tr').forEach(tr=>{const reg=tr.getAttribute('data-reg'),co=tr.getAttribute('data-co');const colReg=!q&&collapsed.has(reg);
    if(tr.classList.contains('conhead')){tr.classList.toggle('collapsed',colReg);}
    else if(tr.classList.contains('ccap')){const colC=!q&&collapsedC.has(co);tr.classList.toggle('collapsed',colC);tr.classList.toggle('hide',colReg);}
    else if(tr.classList.contains('crow')){const colC=!q&&collapsedC.has(co);tr.classList.toggle('hide',colReg||colC);}});
  const v=document.getElementById("heatRegion").value;const anyOpen=DATA.regions.some(rg=>(v==="all"||rg.name===v)&&!collapsed.has(rg.name));
  document.getElementById("collB").textContent=collLabel("heat");persist();fitHeat();}
function updateHeatMonth(){document.querySelectorAll('#heatTable thead th.mh').forEach((th,j)=>th.classList.toggle('sel',j===selMonth));
  document.querySelectorAll('#heatTable tbody tr.crow').forEach(tr=>{tr.querySelectorAll('td.m').forEach((td,j)=>td.classList.toggle('cur',j===selMonth));});persist();}

const VISA_OPTS=[["all",["All visa types","วีซ่า: ทั้งหมด"]],["free",["Visa-free only","ฟรีวีซ่าเท่านั้น"]],["voa",["Visa on arrival","ขอที่ด่าน (VOA)"]],["freevoa",["Visa-free or VOA","ฟรีวีซ่า หรือ VOA"]],["req",["Visa required","ต้องขอวีซ่า"]]];
function hay(city,co,rg){return ((city&&(city.city||""))+" "+(city&&(city.cityEn||""))+" "+
  (co?((co.cnTh||"")+" "+(co.cnEn||"")+" "+(co.name||"")):"")+" "+
  (rg?((rg.name||"")+" "+(rg.en||"")):"")).toLowerCase();}
function hitsQ(city,co,rg,q){return !q||hay(city,co,rg).includes(q);}
function visaOk(v,f){if(!f||f==="all")return true;const t=(v&&v.t)||"req";
  if(f==="free")return t==="free"||t==="home";
  if(f==="voa")return t==="voa";
  if(f==="freevoa")return t==="free"||t==="voa"||t==="home";
  if(f==="req")return t==="req";return true;}
function fillVisaSelects(){["visaSel","visaSelH"].forEach(id=>{const el=document.getElementById(id);if(!el)return;const cur=el.value;
  el.innerHTML=VISA_OPTS.map(([k,L])=>`<option value="${k}">${lang==="en"?L[0]:L[1]}</option>`).join("");
  if(cur)el.value=cur;});}
function visaFilter(id){const el=document.getElementById(id);return el?el.value:"all";}
function visaTxt(v){if(!v)return null;const en=lang==="en";
  if(v.t==="home")return {cls:"home",main:en?"Home country":"ประเทศไทย",sub:""};
  if(v.t==="free")return {cls:"free",main:(en?"Visa-free "+v.d+" days":"ฟรีวีซ่า "+v.d+" วัน"),sub:en?(v.nEn||""):(v.nTh||"")};
  if(v.t==="voa")return {cls:"voa",main:(en?"Visa on arrival "+v.d+" days":"ขอวีซ่าที่ด่าน (VOA) "+v.d+" วัน"),sub:en?(v.nEn||""):(v.nTh||"")};
  return {cls:"req",main:en?"Visa required in advance":"ต้องขอวีซ่าล่วงหน้า",sub:en?(v.nEn||""):(v.nTh||"")};}
function visaBadge(v){const s=visaTxt(v);if(!s)return"";const en=lang==="en";
  const short=s.cls==="free"?(en?v.d+"d":v.d+" \u0e27\u0e31\u0e19")
    :s.cls==="voa"?(en?"VOA "+v.d+"d":"VOA "+v.d)
    :s.cls==="home"?(en?"Home":"\u0e44\u0e17\u0e22")
    :(en?"Visa":"\u0e02\u0e2d\u0e27\u0e35\u0e0b\u0e48\u0e32");
  return `<span class="vb ${s.cls}" title="${s.main}">${short}</span>`;}
let _curCity=null,_lastFocus=null,_scrollY=0;
function openCity(idx){const c=ALL[idx];if(!c)return;const t=L();
  const cur=selMonth;
  let yb='<div class="yearbar">';
  for(let i=0;i<12;i++){const v=c.r[i];const h=hlOf(c,i);const em=h?h.match(/^\S+/)[0]:'';
    yb+=`<div class="yb v${v}${i===cur?' cur':''}"><div class="mn">${ab(i)}</div><div class="em">${em}</div></div>`;}
  yb+='</div>';
  const hkeys=Object.keys(c.hl).sort((a,b)=>a-b);
  const hls=hkeys.map(k=>`<span>${ab(+k)}: ${hlOf(c,+k)}</span>`).join("");
  let body=`<h3 id="modalTitle">${nameOf(c)}</h3><div class="mreg">${(lang==="en"?(c.cnEn||""):(c.cnTh||"")).replace(/\s+/g," ").trim()} · ${lang==="en"?c.regionEn:c.region}</div>${(()=>{const v=visaTxt(c.visa);if(!v)return"";return `<div class="mvisa ${v.cls}">\ud83d\udec2 ${v.main}</div>`+(v.sub?`<div class="mvsub">${v.sub}</div>`:"");})()}<div class="mbest">${t.best} ${bestOf(c)}</div>${yb}`;
  if(hls)body+=`<div class="mhls">${hls}</div>`;
  {const avoid=c.r.map((v,i)=>v===1?ab(i):null).filter(Boolean).join(", ");
   if(avoid)body+=`<div class="msum"><span class="k">${t.caution}</span> ${avoid}</div>`;
   const det=lang==="en"?(c.noteEn||c.note):c.note;
   const dlbl=lang==="en"?"Details":"\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14";
   body+=`<div class="mnote"><span class="lbl">${dlbl}</span>${det}</div>`;}
  if(c.sights&&c.sights.length){const lbl=lang==="en"?"Top sights":"\u0e17\u0e35\u0e48\u0e40\u0e17\u0e35\u0e48\u0e22\u0e27\u0e40\u0e14\u0e48\u0e19";
    const omap=lang==="en"?"Open in Google Maps":"\u0e40\u0e1b\u0e34\u0e14\u0e43\u0e19 Google Maps";
    const pc=c.cityEn.split("/")[0].split(":")[0].split(" \u00b7 ")[0].trim();
    body+=`<div class="msights"><div class="slbl">\ud83d\uddfa\ufe0f ${lbl}</div>`+
      c.sights.map(s=>{const q=encodeURIComponent(s.en+" "+pc);
        return `<a class="sg" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" title="${omap}">${s.e} ${lang==="en"?s.en:s.th} <span class="ext">\u2197</span></a>`;}).join("")+`</div>`;}
  body+=`<div class="mlegend"><span><i style="background:var(--g-fill)"></i>${t.great}</span><span><i style="background:var(--a-fill)"></i>${t.ok}</span><span><i style="background:var(--r-fill)"></i>${t.avoid}</span></div>`;
  body+=`<div class="msrc">${lang==="en"?"Visa: Thai ordinary passport \u00b7 "+DATA.visaSource.en+" \u2014 verify before travel":"\u0e27\u0e35\u0e0b\u0e48\u0e32: \u0e2b\u0e19\u0e31\u0e07\u0e2a\u0e37\u0e2d\u0e40\u0e14\u0e34\u0e19\u0e17\u0e32\u0e07\u0e44\u0e17\u0e22 \u00b7 "+DATA.visaSource.th+" \u2014 \u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e01\u0e48\u0e2d\u0e19\u0e40\u0e14\u0e34\u0e19\u0e17\u0e32\u0e07"}</div>`;
  document.getElementById("modalBody").innerHTML=body;
  _curCity=idx;
  const en=lang==="en";
  const xb=document.querySelector(".x");
  xb.innerHTML="&times;";
  xb.setAttribute("aria-label",en?"Close":"\u0e1b\u0e34\u0e14");
  const scrim=document.getElementById("scrim");
  if(!scrim.classList.contains("show")){
    _lastFocus=document.activeElement;
    _scrollY=window.scrollY;
    document.body.style.position="fixed";document.body.style.top=(-_scrollY)+"px";
    document.body.style.width="100%";document.body.style.overflow="hidden";
  }
  scrim.classList.add("show");
  document.getElementById("modal").scrollTop=0;
  document.getElementById("modal").focus();
  try{history.replaceState(null,"","#city="+encodeURIComponent(c.cityEn));}catch(e){}}
function closeCity(){const scrim=document.getElementById("scrim");
  if(!scrim.classList.contains("show"))return;
  scrim.classList.remove("show");_curCity=null;
  document.body.style.position="";document.body.style.top="";
  document.body.style.width="";document.body.style.overflow="";
  window.scrollTo(0,_scrollY||0);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  if(_lastFocus&&_lastFocus.focus)_lastFocus.focus();_lastFocus=null;}
document.addEventListener("keydown",e=>{
  const open=document.getElementById("scrim").classList.contains("show");
  if(e.key==="Escape"){closeCity();return;}
  if(!open)return;
  if(e.key==="Tab"){
    const m=document.getElementById("modal");
    const f=[...m.querySelectorAll('button:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])')];
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===m)){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }});

const LSKEY="wtc_state_v1";
function persist(){try{
  const st={lang,mode,selMonth,incOk:document.getElementById("incOk").checked,
    interests:[...interests],collapsed:[...collapsed],collapsedC:[...collapsedC],
    regionSel:document.getElementById("regionSel").value,
    heatRegion:document.getElementById("heatRegion").value,visaSel:visaFilter("visaSel"),visaSelH:visaFilter("visaSelH")};
  localStorage.setItem(LSKEY,JSON.stringify(st));
}catch(e){}}
function loadState(){try{
  const raw=localStorage.getItem(LSKEY);if(!raw)return null;
  const st=JSON.parse(raw);
  if(st.lang==="en"||st.lang==="th")lang=st.lang;
  if(st.mode==="month"||st.mode==="heatmap")mode=st.mode;
  if(typeof st.selMonth==="number"&&st.selMonth>=0&&st.selMonth<12)selMonth=st.selMonth;
  (st.interests||[]).forEach(x=>interests.add(x));
  (st.collapsed||[]).forEach(x=>collapsed.add(x));
  (st.collapsedC||[]).forEach(x=>collapsedC.add(x));
  return st;
}catch(e){return null;}}

const _saved=loadState();
applyStatic();buildMonths();buildHeatMonths();buildInterests();buildRegionSelects();
if(_saved){
  document.getElementById("incOk").checked=!!_saved.incOk;
  const setSel=(id,v)=>{const s=document.getElementById(id);if(v&&[...s.options].some(o=>o.value===v))s.value=v;};
  setSel("regionSel",_saved.regionSel);setSel("heatRegion",_saved.heatRegion);setSel("visaSel",_saved.visaSel);setSel("visaSelH",_saved.visaSelH);
}
document.body.classList.toggle("th",lang==="th");
document.getElementById("lEN").classList.toggle("on",lang==="en");
document.getElementById("lTH").classList.toggle("on",lang==="th");
document.getElementById("mA").classList.toggle("on",mode==="month");
document.getElementById("mB").classList.toggle("on",mode==="heatmap");
document.getElementById("viewMonth").classList.toggle("hide",mode!=="month");
document.getElementById("viewHeat").classList.toggle("hide",mode!=="heatmap");
if(mode==="heatmap")renderHeat();else render();
(function(){try{const m=(location.hash||"").match(/city=([^&]+)/);if(!m)return;
  const ce=decodeURIComponent(m[1]);const i=ALL.findIndex(c=>c.cityEn===ce);
  if(i>=0)setTimeout(()=>openCity(i),60);}catch(e){}})();
</script>
