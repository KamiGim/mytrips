<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Travel Calendar · ปฏิทินฤดูเที่ยวโลก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#142029; --ink2:#1b2c39; --ink3:#243a4b;
  --paper:#FBF8F1; --paper2:#efe7d6; --paper3:#e3d8c0;
  --brass:#c08a2e; --brass-soft:#e8c98a; --brass-tint:rgba(192,138,46,.16);
  --line:rgba(255,255,255,.10);
  --txt:#f3ecdd; --txt-dim:#b9c4cd;
  --g-fill:#bfe0c0; --g-txt:#1B5E20;
  --a-fill:#f0d27e; --a-txt:#6b4400;
  --r-fill:#e6a3a3; --r-txt:#7d1414;
  --shadow:0 6px 20px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,sans-serif;background:var(--ink);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.5}
body.th{font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

header.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#101a22,#142029);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.3)}
.top-in{max-width:1080px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{font-family:"Trirong",serif;font-weight:700;font-size:23px;margin:0;color:var(--paper);white-space:nowrap}
.brand .sub{font-size:12.5px;color:var(--txt-dim);white-space:nowrap}
.brand .compass{color:var(--brass);font-size:19px;transform:translateY(1px)}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;background:#0d161d;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:12.5px;font-weight:700;color:var(--txt-dim);background:none;border:0;padding:6px 11px;border-radius:999px;cursor:pointer;letter-spacing:.4px}
.lang button.on{background:var(--paper);color:var(--ink)}
.modes{display:flex;background:#0d161d;border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{font:inherit;font-size:13px;font-weight:600;color:var(--txt-dim);background:none;border:0;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--brass);color:#1a130a}

.hero{padding:30px 0 8px;border-bottom:1px solid var(--line);margin-bottom:18px}
.hero .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--brass-soft);font-weight:600}
.hero h2{font-family:"Trirong",serif;font-weight:700;font-size:clamp(36px,8.5vw,64px);margin:.06em 0 .04em;color:var(--paper);line-height:1}
.hero .lead{font-size:16px;color:var(--txt-dim);max-width:62ch}
.hero .lead b{color:var(--g-txt);background:var(--g-fill);padding:0 6px;border-radius:5px;font-weight:700}

.months{display:flex;gap:7px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.months button{font:inherit;flex:0 0 auto;font-size:14px;font-weight:600;color:var(--txt-dim);background:#0e1820;border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;transition:.12s}
.months button:hover{border-color:var(--brass)}
.months button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--txt-dim);background:#0e1820;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--brass)}
.chip.on{background:var(--brass);color:#1a130a;border-color:var(--brass);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
select,input[type=search]{font:inherit;font-size:13.5px;color:var(--txt);background:#0e1820;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
input[type=search]{min-width:170px;flex:1}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--txt-dim);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
.metabar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 2px 0}
.count-note{font-size:12.5px;color:var(--txt-dim)}
.collapse-all{font:inherit;font-size:12.5px;color:var(--brass-soft);background:none;border:0;cursor:pointer;font-weight:600}
.collapse-all:hover{text-decoration:underline}

.rgroup{margin-top:24px}
.rhead{display:flex;align-items:center;gap:10px;margin:0 2px 12px;cursor:pointer;user-select:none}
.rhead .chev{color:var(--brass);font-size:13px;width:14px;transition:transform .15s;display:inline-block}
.rhead.collapsed .chev{transform:rotate(-90deg)}
.rhead h3{font-family:"Trirong",serif;font-weight:600;font-size:19px;color:var(--paper);margin:0}
.rhead .n{font-size:12px;color:var(--brass-soft);font-weight:600;background:#0e1820;border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.rhead .bar{height:1px;background:var(--line);flex:1}
.rhead:hover h3{color:var(--brass-soft)}
.chead{display:flex;align-items:center;gap:8px;margin:14px 2px 9px 20px;cursor:pointer;user-select:none}
.chead .chev{color:var(--brass);font-size:11px;width:12px;transition:transform .15s;display:inline-block;opacity:.85}
.chead.collapsed .chev{transform:rotate(-90deg)}
.chead .cn{font-weight:700;font-size:13.5px;color:var(--brass-soft);letter-spacing:.2px}
.chead .n2{font-size:11px;color:var(--txt-dim);background:#0e1820;border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.chead:hover .cn{color:var(--paper)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-left:38px}
.card{background:linear-gradient(180deg,#1e2e3b,#1a2935);color:var(--txt);border-radius:14px;padding:13px 14px 12px;cursor:pointer;border:1px solid rgba(232,201,138,.13);transition:.14s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brass)}
.card .cname{font-weight:700;font-size:15px;line-height:1.25;color:var(--paper)}
.card .cbest{font-size:12px;color:var(--txt-dim);margin-top:2px}
.card .hl{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:13px;font-weight:600;background:rgba(192,138,46,.15);border:1px solid rgba(192,138,46,.28);border-radius:8px;padding:4px 9px;color:var(--brass-soft)}
.card .badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.b3{background:var(--g-fill);color:var(--g-txt)} .b2{background:var(--a-fill);color:var(--a-txt)}
.ribbon{display:flex;gap:2px;margin-top:11px}
.ribbon i{flex:1;height:8px;border-radius:2px;display:block}
.ribbon i.cur{outline:2px solid var(--brass);outline-offset:1px}
.s3{background:#7cc47f} .s2{background:#e6bd4d} .s1{background:#d98686}

.hwrap{overflow:auto;max-height:calc(100vh - 208px);min-height:300px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--ink2)}
table.heat{border-collapse:collapse;width:100%;min-width:780px;font-size:12.5px}
.heat th,.heat td{padding:0;text-align:center}
.heat thead th{position:sticky;top:0;z-index:5;background:var(--ink3);color:var(--paper);font-weight:600;padding:9px 4px;border-bottom:1px solid var(--line)}
.heat thead th:first-child{text-align:left;padding-left:14px;position:sticky;left:0;z-index:6;background:var(--ink3)}
.heat td.city{text-align:left;padding:9px 12px 9px 48px;color:var(--paper);font-weight:600;white-space:nowrap;position:sticky;left:0;background:var(--ink2);border-right:1px solid var(--line);cursor:pointer;font-size:13px;border-left:3px solid transparent}
.heat td.m{width:54px;height:34px;font-weight:700;cursor:pointer;border:1px solid rgba(20,32,41,.10)}
.heat td.m.v3{background:var(--g-fill);color:var(--g-txt)}
.heat td.m.v2{background:var(--a-fill);color:var(--a-txt)}
.heat td.m.v1{background:var(--r-fill);color:var(--r-txt)}
.heat td.m.cur{box-shadow:inset 0 0 0 2px var(--brass)}
.heat tr.crow:hover td{border-top:1px solid var(--brass);border-bottom:1px solid var(--brass)}
.heat tr.crow:hover td.m{box-shadow:inset 0 0 0 9999px var(--brass-tint)}
.heat tr.crow:hover td.m.cur{box-shadow:inset 0 0 0 9999px var(--brass-tint),inset 0 0 0 2px var(--brass)}
.heat tr.crow:hover td.city{background:#22333f;color:var(--brass-soft);border-left:3px solid var(--brass)}
.heat tr.conhead td{background:var(--ink);color:var(--brass-soft);text-align:left;padding:9px 14px;font-weight:700;font-size:13px;letter-spacing:.3px;cursor:pointer;user-select:none;border-top:1px solid var(--line)}
.heat tr.conhead .chev{display:inline-block;width:14px;color:var(--brass);transition:transform .15s}
.heat tr.conhead.collapsed .chev{transform:rotate(-90deg)}
.heat tr.conhead .n{font-weight:600;color:var(--txt-dim);font-size:11.5px}
.heat tr.ccap td{background:var(--ink2);color:var(--txt-dim);text-align:left;padding:6px 14px 6px 32px;font-weight:600;font-size:12px;cursor:pointer;user-select:none}
.heat tr.ccap .chev{display:inline-block;width:12px;color:var(--brass);transition:transform .15s}
.heat tr.ccap.collapsed .chev{transform:rotate(-90deg)}
.heat tr.ccap .n{color:var(--txt-dim);font-weight:600;font-size:11px}
.heat tr.ccap:hover td{color:var(--brass-soft)}

.scrim{position:fixed;inset:0;background:rgba(8,12,16,.66);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.scrim.show{display:flex}
.modal{background:var(--paper);color:var(--ink);max-width:560px;width:100%;border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:88vh;overflow:auto;position:relative}
.modal h3{font-family:"Trirong",serif;font-size:23px;margin:0 0 2px;line-height:1.18}
.modal .mbest{font-size:13px;color:#6b5d42;font-weight:600}
.modal .mreg{display:inline-block;font-size:11.5px;color:var(--brass);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:3px}
.yearbar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:16px 0 6px}
.yb{border-radius:6px;padding:6px 0 7px;text-align:center}
.yb .mn{font-size:10px;font-weight:600;opacity:.75}
.yb .em{font-size:14px;line-height:1.5;min-height:20px}
.yb.v3{background:var(--g-fill);color:var(--g-txt)} .yb.v2{background:var(--a-fill);color:var(--a-txt)} .yb.v1{background:var(--r-fill);color:var(--r-txt)}
.yb.cur{outline:2px solid var(--brass);outline-offset:1px}
.msum{font-size:13.5px;color:#33414b;background:var(--paper2);border-radius:10px;padding:11px 13px;margin-top:10px;line-height:1.7}
.msum .k{font-weight:700;color:#5a4a2c}
.mnote{font-size:13.5px;color:#3a4751;border:1px dashed var(--paper3);border-radius:10px;padding:10px 13px;margin-top:9px;line-height:1.6}
.mnote .lbl{display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#9a8a6c;font-weight:700;margin-bottom:4px}
.mhls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.mhls span{font-size:12.5px;background:var(--paper2);border-radius:8px;padding:4px 9px;color:#5a4a2c;font-weight:600}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#6b5d42;margin-top:14px}
.mlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.msights{margin-top:12px}
.msights .slbl{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:7px}
.msights .sg{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--paper2);border:1px solid var(--paper3);border-radius:8px;padding:4px 9px;margin:0 6px 6px 0;color:#3a4751;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.msights a.sg:hover{border-color:var(--brass);color:var(--brass);background:#fff}
.msights .sg .ext{font-size:9px;opacity:.45;margin-left:1px}
.msights a.sg:hover .ext{opacity:.9}
.x{position:absolute;top:14px;right:16px;font-size:22px;color:#8a7a5c;cursor:pointer;background:none;border:0;line-height:1}

.empty{text-align:center;color:var(--txt-dim);padding:50px 20px;font-size:15px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--txt-dim);line-height:1.7}
footer b{color:var(--brass-soft)}
.hide{display:none!important}
@media (max-width:560px){.brand .sub{display:none}.hero{padding:22px 0 6px}.chead{margin-left:12px}.cards{grid-template-columns:1fr 1fr;gap:9px;margin-left:18px}.card{padding:11px}.card .cname{font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="compass">&#10038;</span><h1 id="brandTitle"></h1><span class="sub" id="brandsub"></span></div>
    <div class="right">
      <div class="lang">
        <button id="lEN" class="on" onclick="setLang('en')">EN</button>
        <button id="lTH" onclick="setLang('th')">&#3652;&#3607;&#3618;</button>
      </div>
      <div class="modes">
        <button id="mA" class="on" onclick="setMode('month')"></button>
        <button id="mB" onclick="setMode('heatmap')"></button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="viewMonth">
    <div class="hero">
      <div class="eyebrow" id="ebA"></div>
      <h2 id="heroMonth">&mdash;</h2>
      <div class="lead" id="heroLead"></div>
      <div class="months" id="monthRow"></div>
    </div>
    <div class="filters" id="interestRow"></div>
    <div class="tools">
      <select id="regionSel" onchange="render()"></select>
      <input type="search" id="searchBox" oninput="render()">
      <label class="toggle"><input type="checkbox" id="incOk" onchange="render()"> <span id="incOkL"></span></label>
    </div>
    <div class="metabar"><div class="count-note" id="countNote"></div><button class="collapse-all" id="collA" onclick="toggleAll('month')"></button></div>
    <div id="results"></div>
  </section>

  <section id="viewHeat" class="hide">
    <div class="hero" style="padding-bottom:14px">
      <div class="eyebrow" id="ebB"></div>
      <h2 id="heatTitle" style="font-size:clamp(30px,6vw,46px)"></h2>
      <div class="lead" id="heatLead"></div>
      <div class="months" id="heatMonthRow"></div>
    </div>
    <div class="tools">
      <select id="heatRegion" onchange="renderHeat()"></select>
      <input type="search" id="heatSearch" oninput="renderHeat()">
      <button class="collapse-all" id="collB" onclick="toggleAll('heat')" style="margin-left:auto"></button>
    </div>
    <div class="hwrap"><table class="heat" id="heatTable"></table></div>
  </section>

  <footer><div id="foot1"></div><div id="foot2" style="margin-top:6px"></div></footer>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeCity()">
  <div class="modal" id="modal"><button class="x" onclick="closeCity()">&times;</button><div id="modalBody"></div></div>
</div>

   modeA:"\u0e40\u0e14\u0e37\u0e2d\u0e19\u0e19\u0e35\u0e49\u0e44\u0e1b\u0e44\u0e2b\u0e19\u0e14\u0e35",modeB:"\u0e2e\u0e35\u0e15\u0e41\u0e21\u0e1b\u0e23\u0e32\u0e22\u0e40\u0e21\u0e37\u0e2d\u0e07",ebA:"\u0e0a\u0e48\u0e27\u0e07\u0e40\u0e27\u0e25\u0e32\u0e17\u0e35\u0e48\u0e14\u0e35\u0e17\u0e35\u0e48\u0e2a\u0e38\u0e14\u0e43\u0e19\u0e01\u0e32\u0e23\u0e40\u0e14\u0e34\u0e19\u0e17\u0e32\u0e07",ebB:"\u0e15\u0e32\u0e23\u0e32\u0e07\u0e04\u0e27\u0e32\u0e21\u0e40\u0e2b\u0e21\u0e32\u0e30\u0e2a\u0e21\u0e23\u0e32\u0e22\u0e40\u0e14\u0e37\u0e2d\u0e19",
   heatTitle:"\u0e2e\u0e35\u0e15\u0e41\u0e21\u0e1b\u0e23\u0e32\u0e22\u0e40\u0e21\u0e37\u0e2d\u0e07",heatLead:"\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e20\u0e39\u0e21\u0e34\u0e20\u0e32\u0e04\u0e2b\u0e23\u0e37\u0e2d\u0e40\u0e25\u0e37\u0e48\u0e2d\u0e19\u0e14\u0e39\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 \u2014 \u0e41\u0e15\u0e30\u0e0a\u0e37\u0e48\u0e2d\u0e40\u0e21\u0e37\u0e2d\u0e07\u0e2b\u0e23\u0e37\u0e2d\u0e0a\u0e48\u0e2d\u0e07\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e14\u0e39\u0e17\u0e31\u0e49\u0e07\u0e1b\u0e35",
   incOk:"\u0e23\u0e27\u0e21 \u201c\u0e1e\u0e2d\u0e44\u0e14\u0e49\u201d \u0e14\u0e49\u0e27\u0e22",searchCity:"\u0e04\u0e49\u0e19\u0e0a\u0e37\u0e48\u0e2d\u0e40\u0e21\u0e37\u0e2d\u0e07\u2026",allRegions:"\u0e17\u0e38\u0e01\u0e20\u0e39\u0e21\u0e34\u0e20\u0e32\u0e04",
   greatOnly:"\u0e40\u0e09\u0e1e\u0e32\u0e30\u0e14\u0e35\u0e21\u0e32\u0e01",withOk:"\u0e23\u0e27\u0e21\u0e1e\u0e2d\u0e44\u0e14\u0e49",
   leadFn:(g,t,m)=>`\u0e40\u0e14\u0e37\u0e2d\u0e19${m} \u0e21\u0e35 <b>${g}</b> \u0e40\u0e21\u0e37\u0e2d\u0e07\u0e17\u0e35\u0e48\u0e01\u0e33\u0e25\u0e31\u0e07\u0e40\u0e02\u0e49\u0e32\u0e2b\u0e19\u0e49\u0e32\u0e40\u0e17\u0e35\u0e48\u0e22\u0e27\u0e17\u0e35\u0e48\u0e14\u0e35\u0e17\u0e35\u0e48\u0e2a\u0e38\u0e14 \u0e08\u0e32\u0e01\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 ${t} \u0e40\u0e21\u0e37\u0e2d\u0e07`,
   foundFn:(n,inc)=>`\u0e1e\u0e1a ${n} \u0e40\u0e21\u0e37\u0e2d\u0e07 \u00b7 ${inc}`,
   empty:"\u0e44\u0e21\u0e48\u0e1e\u0e1a\u0e40\u0e21\u0e37\u0e2d\u0e07\u0e17\u0e35\u0e48\u0e15\u0e23\u0e07\u0e40\u0e07\u0e37\u0e48\u0e2d\u0e19\u0e44\u0e02 \u2014 \u0e25\u0e2d\u0e07\u0e40\u0e1b\u0e34\u0e14 \u201c\u0e23\u0e27\u0e21\u0e1e\u0e2d\u0e44\u0e14\u0e49\u201d \u0e2b\u0e23\u0e37\u0e2d\u0e40\u0e2d\u0e32\u0e15\u0e31\u0e27\u0e01\u0e23\u0e2d\u0e07\u0e2d\u0e2d\u0e01",
   best:"\u0e0a\u0e48\u0e27\u0e07\u0e17\u0e35\u0e48\u0e14\u0e35\u0e17\u0e35\u0e48\u0e2a\u0e38\u0e14:",peak:"\u0e40\u0e14\u0e37\u0e2d\u0e19\u0e14\u0e35\u0e21\u0e32\u0e01:",caution:"\u0e04\u0e27\u0e23\u0e40\u0e25\u0e35\u0e48\u0e22\u0e07:",highlights:"\u0e44\u0e2e\u0e44\u0e25\u0e15\u0e4c:",none:"\u2014",
   great:"\u0e14\u0e35\u0e21\u0e32\u0e01",ok:"\u0e1e\u0e2d\u0e44\u0e14\u0e49",avoid:"\u0e40\u0e25\u0e35\u0e48\u0e22\u0e07",thDetail:"\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14 (\u0e44\u0e17\u0e22)",city:"\u0e40\u0e21\u0e37\u0e2d\u0e07",
   collapseAll:"\u0e22\u0e48\u0e2d\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14",expandAll:"\u0e02\u0e22\u0e32\u0e22\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14",
   foot1:"<b>192 \u0e40\u0e21\u0e37\u0e2d\u0e07 \u00b7 9 \u0e20\u0e39\u0e21\u0e34\u0e20\u0e32\u0e04 \u00b7 5 \u0e17\u0e27\u0e35\u0e1b</b> \u2014 \u0e40\u0e02\u0e35\u0e22\u0e27 = \u0e14\u0e35\u0e21\u0e32\u0e01 \u00b7 \u0e40\u0e2b\u0e25\u0e37\u0e2d\u0e07 = \u0e1e\u0e2d\u0e44\u0e14\u0e49 \u00b7 \u0e41\u0e14\u0e07 = \u0e40\u0e25\u0e35\u0e48\u0e22\u0e07 (\u0e23\u0e49\u0e2d\u0e19/\u0e2b\u0e19\u0e32\u0e27\u0e08\u0e31\u0e14 \u0e1d\u0e19 \u0e44\u0e15\u0e49\u0e1d\u0e38\u0e48\u0e19; \u0e1a\u0e32\u0e07\u0e17\u0e35\u0e48\u0e2b\u0e19\u0e49\u0e32\u0e2b\u0e19\u0e32\u0e27/\u0e2b\u0e34\u0e21\u0e30\u0e04\u0e37\u0e2d\u0e44\u0e2e\u0e44\u0e25\u0e15\u0e4c)",
   foot2:"\u26a0\ufe0f \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e2d\u0e34\u0e07\u0e44\u0e01\u0e14\u0e4c\u0e17\u0e48\u0e2d\u0e07\u0e40\u0e17\u0e35\u0e48\u0e22\u0e27 + \u0e20\u0e39\u0e21\u0e34\u0e2d\u0e32\u0e01\u0e32\u0e28\u0e17\u0e31\u0e48\u0e27\u0e44\u0e1b (\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48\u0e01\u0e23\u0e21\u0e2d\u0e38\u0e15\u0e38\u0e2f \u0e17\u0e32\u0e07\u0e01\u0e32\u0e23 \u2014 \u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19) \u00b7 \u0e27\u0e31\u0e19\u0e17\u0e35\u0e48\u0e14\u0e2d\u0e01\u0e44\u0e21\u0e49/\u0e43\u0e1a\u0e44\u0e21\u0e49\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e2a\u0e35/\u0e40\u0e17\u0e28\u0e01\u0e32\u0e25\u0e04\u0e25\u0e32\u0e14\u0e40\u0e04\u0e25\u0e37\u0e48\u0e2d\u0e19\u0e44\u0e14\u0e49\u0e17\u0e38\u0e01\u0e1b\u0e35 \u0e04\u0e27\u0e23\u0e40\u0e0a\u0e47\u0e04\u0e1e\u0e22\u0e32\u0e01\u0e23\u0e13\u0e4c\u0e41\u0e25\u0e30\u0e2a\u0e16\u0e32\u0e19\u0e30\u0e2a\u0e16\u0e32\u0e19\u0e17\u0e35\u0e48\u0e01\u0e48\u0e2d\u0e19\u0e40\u0e14\u0e34\u0e19\u0e17\u0e32\u0e07",
 }
};

let lang="en", mode="month", selMonth=new Date().getMonth();
const interests=new Set(), collapsed=new Set(), collapsedC=new Set();
const L=()=>T[lang];
const ab=i=>lang==="en"?EN_ABBR[i]:TH_ABBR[i];
const full=i=>lang==="en"?EN_FULL[i]:TH_FULL[i];
const regName=rg=>lang==="en"?rg.en:rg.name;
const bestOf=c=>lang==="en"?c.bestEn:c.best;
const hlOf=(c,i)=>lang==="en"?c.hlEn[String(i)]:c.hl[String(i)];
const nameOf=c=>lang==="en"?c.cityEn:c.cityTh;
const cnOf=co=>lang==="en"?co.cnEn:co.cnTh;
function cityText(c){return c.city+" "+c.note+" "+Object.values(c.hl).join(" ");}
function matchesCats(c){if(interests.size===0)return true;for(const k of interests){const cat=CATS.find(x=>x.key===k);if(cat.kw.some(w=>cityText(c).includes(w)))return true;}return false;}

function setLang(l){lang=l;document.body.classList.toggle("th",l==="th");
  document.getElementById("lEN").classList.toggle("on",l==="en");
  document.getElementById("lTH").classList.toggle("on",l==="th");
  applyStatic();buildMonths();buildHeatMonths();buildInterests();buildRegionSelects();
  if(mode==="heatmap")renderHeat();else render();}
function setMode(m){mode=m;
  document.getElementById("mA").classList.toggle("on",m==="month");
  document.getElementById("mB").classList.toggle("on",m==="heatmap");
  document.getElementById("viewMonth").classList.toggle("hide",m!=="month");
  document.getElementById("viewHeat").classList.toggle("hide",m!=="heatmap");
  if(m==="heatmap")renderHeat();else render();}

function applyStatic(){const t=L();
  document.getElementById("brandTitle").textContent=t.title;
  document.getElementById("brandsub").textContent=t.sub;
  document.getElementById("mA").textContent=t.modeA;
  document.getElementById("mB").textContent=t.modeB;
  document.getElementById("ebA").textContent=t.ebA;
  document.getElementById("ebB").textContent=t.ebB;
  document.getElementById("heatTitle").textContent=t.heatTitle;
  document.getElementById("heatLead").textContent=t.heatLead;
  document.getElementById("incOkL").textContent=t.incOk;
  document.getElementById("searchBox").placeholder=t.searchCity;
  document.getElementById("heatSearch").placeholder=t.searchCity;
  document.getElementById("foot1").innerHTML=t.foot1;
  document.getElementById("foot2").innerHTML=t.foot2;
  document.documentElement.lang=lang;}

function buildMonths(){const row=document.getElementById("monthRow");row.innerHTML="";
  for(let i=0;i<12;i++){const b=document.createElement("button");b.textContent=ab(i);if(i===selMonth)b.classList.add("on");
    b.onclick=()=>pickMonth(i);row.appendChild(b);}}
function buildHeatMonths(){const row=document.getElementById("heatMonthRow");row.innerHTML="";
  for(let i=0;i<12;i++){const b=document.createElement("button");b.textContent=ab(i);if(i===selMonth)b.classList.add("on");
    b.onclick=()=>pickMonth(i);row.appendChild(b);}}
function pickMonth(i){selMonth=i;buildMonths();buildHeatMonths();if(mode==="heatmap")renderHeat();else render();}
function buildInterests(){const row=document.getElementById("interestRow");row.innerHTML="";
  CATS.forEach(cat=>{const b=document.createElement("button");b.className="chip";b.textContent=lang==="en"?cat.en:cat.th;
    if(interests.has(cat.key))b.classList.add("on");
    b.onclick=()=>{interests.has(cat.key)?interests.delete(cat.key):interests.add(cat.key);buildInterests();render();};row.appendChild(b);});}
function buildRegionSelects(){const t=L();
  const a=document.getElementById("regionSel");const av=a.value;
  a.innerHTML=`<option value="all">${t.allRegions}</option>`+DATA.regions.map(r=>`<option value="${r.name}">${regName(r)}</option>`).join("");
  if(av)a.value=av;
  const h=document.getElementById("heatRegion");const hv=h.value;
  h.innerHTML=`<option value="all">${t.allRegions}</option>`+DATA.regions.map(r=>`<option value="${r.name}">${regName(r)}</option>`).join("");
  if(hv)h.value=hv;}

function ribbon(r,cur){return '<div class="ribbon">'+r.map((v,i)=>`<i class="s${v}${i===cur?' cur':''}"></i>`).join("")+'</div>';}

function render(){if(mode!=="month")return;const t=L();
  const incOk=document.getElementById("incOk").checked;
  const reg=document.getElementById("regionSel").value;
  const q=document.getElementById("searchBox").value.trim().toLowerCase();
  persist();
  document.getElementById("heroMonth").textContent=full(selMonth);
  const match=c=>{const ok=incOk?c.r[selMonth]>=2:c.r[selMonth]===3;if(!ok)return false;
    if(reg!=="all"&&c.region!==reg)return false;if(!matchesCats(c))return false;
    if(q&&!c.city.toLowerCase().includes(q))return false;return true;};
  const pool=ALL.filter(match);
  const good=ALL.filter(c=>c.r[selMonth]===3).length;
  document.getElementById("heroLead").innerHTML=t.leadFn(good,DATA.total,full(selMonth));
  document.getElementById("countNote").textContent=t.foundFn(pool.length,incOk?t.withOk:t.greatOnly);
  const byKey={};pool.forEach(c=>{const k=c.region+"@@"+c.country;(byKey[k]=byKey[k]||[]).push(c);});
  const regCount=rg=>rg.countries.reduce((s,co)=>s+((byKey[rg.name+"@@"+co.name]||[]).length),0);
  const anyOpen=DATA.regions.some(rg=>(reg==="all"||rg.name===reg)&&regCount(rg)>0&&!collapsed.has(rg.name));
  document.getElementById("collA").textContent=anyOpen?t.collapseAll:t.expandAll;
  const res=document.getElementById("results");
  if(pool.length===0){res.innerHTML=`<div class="empty">${t.empty}</div>`;return;}
  let html="";
  DATA.regions.forEach((rg,ri)=>{
    if(reg!=="all"&&rg.name!==reg)return;
    const rc=regCount(rg);if(rc===0)return;
    const colReg=collapsed.has(rg.name)&&!q;
    html+=`<div class="rgroup"><div class="rhead${colReg?' collapsed':''}" onclick="toggleReg('${rg.name}')"><span class="chev">\u25be</span><h3>${regName(rg)}</h3><span class="n">${rc}</span><div class="bar"></div></div>`;
    if(!colReg){
      rg.countries.forEach((co,ci)=>{
        const list=byKey[rg.name+"@@"+co.name];if(!list||!list.length)return;
        const colC=collapsedC.has(rg.name+"@@"+co.name)&&!q;
        html+=`<div class="chead${colC?' collapsed':''}" onclick="toggleCountry(${ri},${ci})"><span class="chev">\u25be</span><span class="cn">${cnOf(co)}</span><span class="n2">${list.length}</span></div>`;
        if(!colC){html+='<div class="cards">';
          list.forEach(c=>{const rate=c.r[selMonth];
            const badge=rate===3?`<span class="badge b3">${t.great}</span>`:`<span class="badge b2">${t.ok}</span>`;
            const hv=hlOf(c,selMonth);const hl=hv?`<div class="hl">${hv}</div>`:'';
            html+=`<div class="card" onclick="openCity(${c._i})">${badge}<div class="cname">${nameOf(c)}</div><div class="cbest">${t.best} ${bestOf(c)}</div>${hl}${ribbon(c.r,selMonth)}</div>`;});
          html+='</div>';}
      });
    }
    html+="</div>";});
  res.innerHTML=html;}

function renderHeat(){const t=L();
  const reg=document.getElementById("heatRegion").value||"all";
  const q=document.getElementById("heatSearch").value.trim().toLowerCase();
  persist();
  const cur=selMonth;
  const inScope=rg=>reg==="all"||rg.name===reg;
  const anyOpen=DATA.regions.some(rg=>inScope(rg)&&!collapsed.has(rg.name));
  document.getElementById("collB").textContent=anyOpen?t.collapseAll:t.expandAll;
  let html="<thead><tr><th>"+t.city+"</th>"+EN_ABBR.map((m,i)=>`<th>${ab(i)}</th>`).join("")+"</tr></thead><tbody>";
  DATA.regions.forEach((rg,ri)=>{
    if(!inScope(rg))return;
    const cnt=rg.countries.reduce((s,co)=>s+co.cities.filter(c=>!q||c.city.toLowerCase().includes(q)).length,0);
    if(q&&cnt===0)return;
    const colReg=collapsed.has(rg.name)&&!q;
    html+=`<tr class="conhead${colReg?' collapsed':''}" onclick="toggleReg('${rg.name}')"><td colspan="13"><span class="chev">\u25be</span> ${regName(rg)} <span class="n">(${cnt})</span></td></tr>`;
    if(colReg)return;
    rg.countries.forEach((co,ci)=>{const cs=co.cities.filter(c=>!q||c.city.toLowerCase().includes(q));if(!cs.length)return;
      const colC=collapsedC.has(rg.name+"@@"+co.name)&&!q;
      html+=`<tr class="ccap${colC?' collapsed':''}" onclick="toggleCountry(${ri},${ci})"><td colspan="13"><span class="chev">\u25be</span> ${cnOf(co)} <span class="n">(${cs.length})</span></td></tr>`;
      if(colC)return;
      cs.forEach(cc=>{const c=ALL[cc._i!==undefined?cc._i:ALL.findIndex(x=>x.city===cc.city)];const idx=c._i;
        html+=`<tr class="crow"><td class="city" onclick="openCity(${idx})">${nameOf(c)}</td>`+
          c.r.map((v,i)=>{const lab=v===3?t.great:(v===2?t.ok:t.avoid);return `<td class="m v${v}${i===cur?' cur':''}" onclick="openCity(${idx})" title="${full(i)}: ${lab}">${v===3?'\u25cf':(v===2?'\u25cb':'\u00d7')}</td>`;}).join("")+`</tr>`;});});
  });
  html+="</tbody>";document.getElementById("heatTable").innerHTML=html;fitHeat();}
function fitHeat(){const hw=document.querySelector('.hwrap');if(!hw||mode!=="heatmap")return;
  const docTop=hw.getBoundingClientRect().top+window.scrollY;
  hw.style.maxHeight=Math.max(280,window.innerHeight-docTop-16)+"px";}
window.addEventListener("resize",fitHeat);

function toggleReg(name){collapsed.has(name)?collapsed.delete(name):collapsed.add(name);if(mode==="heatmap")renderHeat();else render();}
function toggleCountry(ri,ci){const rg=DATA.regions[ri],co=rg.countries[ci];const k=rg.name+"@@"+co.name;
  collapsedC.has(k)?collapsedC.delete(k):collapsedC.add(k);if(mode==="heatmap")renderHeat();else render();}
function toggleAll(which){
  const regs=which==="heat"
    ? DATA.regions.filter(r=>{const v=document.getElementById("heatRegion").value;return v==="all"||r.name===v;})
    : DATA.regions;
  const anyOpen=regs.some(r=>!collapsed.has(r.name));
  regs.forEach(r=>{if(anyOpen)collapsed.add(r.name);else collapsed.delete(r.name);});
  if(which==="heat")renderHeat();else render();}

function openCity(idx){const c=ALL[idx];if(!c)return;const t=L();
  const cur=selMonth;
  let yb='<div class="yearbar">';
  for(let i=0;i<12;i++){const v=c.r[i];const h=hlOf(c,i);const em=h?h.match(/^\S+/)[0]:'';
    yb+=`<div class="yb v${v}${i===cur?' cur':''}"><div class="mn">${ab(i)}</div><div class="em">${em}</div></div>`;}
  yb+='</div>';
  const hkeys=Object.keys(c.hl).sort((a,b)=>a-b);
  const hls=hkeys.map(k=>`<span>${ab(+k)}: ${hlOf(c,+k)}</span>`).join("");
  let body=`<h3>${nameOf(c)}</h3><div class="mbest">${t.best} ${bestOf(c)}</div><div class="mreg">${lang==="en"?c.regionEn:c.region}</div>${yb}`;
  if(hls)body+=`<div class="mhls">${hls}</div>`;
  if(lang==="en"){
    const great=c.r.map((v,i)=>v===3?EN_ABBR[i]:null).filter(Boolean).join(", ")||t.none;
    const avoid=c.r.map((v,i)=>v===1?EN_ABBR[i]:null).filter(Boolean).join(", ");
    body+=`<div class="msum"><span class="k">${t.peak}</span> ${great}`+(avoid?` &nbsp;\u00b7&nbsp; <span class="k">${t.caution}</span> ${avoid}`:'')+`</div>`;
    const det=c.noteEn||c.note;
    body+=`<div class="mnote"><span class="lbl">Details</span>${det}</div>`;
  }else{
    body+=`<div class="msum">${c.note}</div>`;
  }
  if(c.sights&&c.sights.length){const lbl=lang==="en"?"Top sights":"\u0e17\u0e35\u0e48\u0e40\u0e17\u0e35\u0e48\u0e22\u0e27\u0e40\u0e14\u0e48\u0e19";
    const omap=lang==="en"?"Open in Google Maps":"\u0e40\u0e1b\u0e34\u0e14\u0e43\u0e19 Google Maps";
    const pc=c.cityEn.split("/")[0].split(":")[0].split(" \u00b7 ")[0].trim();
    body+=`<div class="msights"><div class="slbl">\ud83d\uddfa\ufe0f ${lbl}</div>`+
      c.sights.map(s=>{const q=encodeURIComponent(s.en+" "+pc);
        return `<a class="sg" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" title="${omap}">${s.e} ${lang==="en"?s.en:s.th} <span class="ext">\u2197</span></a>`;}).join("")+`</div>`;}
  body+=`<div class="mlegend"><span><i style="background:var(--g-fill)"></i>${t.great}</span><span><i style="background:var(--a-fill)"></i>${t.ok}</span><span><i style="background:var(--r-fill)"></i>${t.avoid}</span></div>`;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("scrim").classList.add("show");}
function closeCity(){document.getElementById("scrim").classList.remove("show");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCity();});

const LSKEY="wtc_state_v1";
function persist(){try{
  const st={lang,mode,selMonth,incOk:document.getElementById("incOk").checked,
    interests:[...interests],collapsed:[...collapsed],collapsedC:[...collapsedC],
    regionSel:document.getElementById("regionSel").value,
    heatRegion:document.getElementById("heatRegion").value};
  localStorage.setItem(LSKEY,JSON.stringify(st));
}catch(e){}}
function loadState(){try{
  const raw=localStorage.getItem(LSKEY);if(!raw)return null;
  const st=JSON.parse(raw);
  if(st.lang==="en"||st.lang==="th")lang=st.lang;
  if(st.mode==="month"||st.mode==="heatmap")mode=st.mode;
  if(typeof st.selMonth==="number"&&st.selMonth>=0&&st.selMonth<12)selMonth=st.selMonth;
  (st.interests||[]).forEach(x=>interests.add(x));
  (st.collapsed||[]).forEach(x=>collapsed.add(x));
  (st.collapsedC||[]).forEach(x=>collapsedC.add(x));
  return st;
}catch(e){return null;}}

const _saved=loadState();
applyStatic();buildMonths();buildHeatMonths();buildInterests();buildRegionSelects();
if(_saved){
  document.getElementById("incOk").checked=!!_saved.incOk;
  const setSel=(id,v)=>{const s=document.getElementById(id);if(v&&[...s.options].some(o=>o.value===v))s.value=v;};
  setSel("regionSel",_saved.regionSel);setSel("heatRegion",_saved.heatRegion);
}
document.body.classList.toggle("th",lang==="th");
document.getElementById("lEN").classList.toggle("on",lang==="en");
document.getElementById("lTH").classList.toggle("on",lang==="th");
document.getElementById("mA").classList.toggle("on",mode==="month");
document.getElementById("mB").classList.toggle("on",mode==="heatmap");
document.getElementById("viewMonth").classList.toggle("hide",mode!=="month");
document.getElementById("viewHeat").classList.toggle("hide",mode!=="heatmap");
if(mode==="heatmap")renderHeat();else render();
</script>
</body>
